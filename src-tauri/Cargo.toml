[package]
name = "timeup"
version = "0.0.0"
description = "A simply using task manage app"
authors = ["EyKettle"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-unminimize", "window-minimize", "window-unmaximize", "window-start-dragging", "window-show", "window-hide", "window-maximize", "window-close", "shell-open"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.*"
window-shadows = "0.2.*"
window-vibrancy = "0.4.*"
wasm-bindgen = "0.2"
lazy_static = "1.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
